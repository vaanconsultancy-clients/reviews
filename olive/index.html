<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Your Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
  .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 420px; width: 90%; }
  h1 { font-size: 22px; color: #333; margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
  
  .stars { display: flex; justify-content: center; gap: 10px; font-size: 50px; cursor: pointer; margin-bottom: 10px; }
  .star { color: #ddd; transition: 0.2s; }
  .star:hover, .star.active { color: #FFD700; }

  #options-area { display: none; margin-top: 20px; text-align: left; }
  .option-box { background: #f9f9f9; border: 2px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-size: 14px; color: #444; }
  .option-box.selected { border-color: #4285F4; background: #eef4ff; }

  button { width: 100%; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; display: none; background: #4285F4; color: white; }
</style>
</head>
<body>

<div class="card">
  <div id="rating-step">
    <h1>How was your visit?</h1>
    <p>Tap a star to rate your experience.</p>
    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
  </div>

  <div id="options-area">
    <h1 id="options-title" style="margin-bottom: 15px;">Select a review</h1>
    <div id="review-list"></div>
    <button class="btn-google" id="google-btn" onclick="goToGoogle()">Ready to Review →</button>
  </div>
</div>

<script>
  // --- CONFIGURATION ---
  const GOOGLE_REVIEW_LINK = "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID"; 

  const REVIEW_OPTIONS = {
    5: ["Excellent service! Truly a 5-star experience.", "Absolutely loved it here.", "Best experience I've had in a long time."],
    4: ["Very good experience overall.", "Really enjoyed my visit.", "Good quality and nice atmosphere."],
    3: ["It was okay. Nothing special.", "Average experience.", "Fair quality."],
    2: ["Below average. The service was slow.", "Not the best experience.", "Expected much better."],
    1: ["Very disappointed.", "Terrible service.", "Extremely unhappy."]
  };

  const stars = document.querySelectorAll('.star');
  let selectedRating = 0;
  let selectedText = "";

  stars.forEach(star => {
    star.addEventListener('click', function() {
      selectedRating = parseInt(this.getAttribute('data-value'));
      stars.forEach(s => s.classList.remove('active'));
      for(let i = 0; i < selectedRating; i++) stars[i].classList.add('active');
      setTimeout(() => showOptions(selectedRating), 300);
    });
  });

  function showOptions(rating) {
    document.getElementById('rating-step').style.display = 'none';
    document.getElementById('options-area').style.display = 'block';
    const listContainer = document.getElementById('review-list');
    listContainer.innerHTML = "";
    const options = REVIEW_OPTIONS[rating] || [];
    options.forEach(text => {
      const div = document.createElement('div');
      div.className = 'option-box';
      div.innerText = text;
      div.onclick = () => selectOption(div, text);
      listContainer.appendChild(div);
    });
  }

  function selectOption(element, text) {
    document.querySelectorAll('.option-box').forEach(box => box.classList.remove('selected'));
    element.classList.add('selected');
    selectedText = text;
    document.getElementById('google-btn').style.display = 'block';
  }

  function goToGoogle() {
    if(!selectedText) return;
    
    // Auto-copy to clipboard
    navigator.clipboard.writeText(selectedText).then(() => {
      // The Magic Attempt: We try to pass the text via URL (Google will ignore this)
      const finalUrl = GOOGLE_REVIEW_LINK + "&text=" + encodeURIComponent(selectedText);
      
      // To the customer, it looks like it's loading and taking them there
      document.getElementById('google-btn').innerText = "Opening Google...";
      
      setTimeout(() => {
        window.location.href = finalUrl;
      }, 500);
    });
  }
</script>

</body>
</html>
